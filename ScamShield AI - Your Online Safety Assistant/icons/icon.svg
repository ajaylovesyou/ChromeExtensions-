<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 64,12 
           C 85,12 110,22 110,34 
           C 110,78 88,106 64,118 
           C 40,106 18,78 18,34 
           C 18,22 43,12 64,12 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="4" 
        filter="url(#glow)"/>

  <!-- Inner Protection Ring -->
  <path d="M 64,22 
           C 80,22 100,30 100,40 
           C 100,74 82,98 64,108 
           C 46,98 28,74 28,40 
           C 28,30 48,22 64,22 Z" 
        fill="none" 
        stroke="#0369a1" 
        stroke-width="1.5" 
        stroke-dasharray="4 3" 
        opacity="0.6"/>

  <!-- Checkmark -->
  <path d="M 40,62 L 56,78 L 88,46" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
