<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdBlock Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Bar -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-name">AdBlock<span class="brand-highlight">Pro</span></span>
          <span id="versionBadge" class="version-badge">v1.1</span>
        </div>
      </div>
      <button id="openOptionsBtn" class="icon-btn" title="Open Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main Power Switch Hero -->
    <section class="hero-section">
      <button id="globalPowerBtn" class="power-button active" title="Toggle Protection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
      </button>
      <div id="statusLabel" class="status-label">Protection is Active</div>
      <div id="statusSub" class="status-sub">All ad networks & trackers blocked</div>
    </section>

    <!-- Site Whitelist Card -->
    <section class="site-card">
      <div class="site-info">
        <div class="site-host" id="currentSiteDomain">Loading current tab...</div>
        <div class="site-status" id="siteStatusText">Ad blocking on this website</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="siteToggle" checked>
        <span class="slider round"></span>
      </label>
    </section>

    <!-- Statistics Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="pageBlockedCount">0</span>
        <span class="stat-title">Blocked This Page</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="allTimeBlockedCount">0</span>
        <span class="stat-title">All-Time Total</span>
      </div>
    </section>

    <!-- Features Overview -->
    <section class="features-list">
      <div class="feature-item">
        <span class="check-icon">✓</span>
        <span>Banner & Display Ads</span>
        <span class="feature-tag">BLOCKED</span>
      </div>
      <div class="feature-item">
        <span class="check-icon">✓</span>
        <span>Video Pre-rolls & Overlays</span>
        <span class="feature-tag">SKIPPED</span>
      </div>
      <div class="feature-item">
        <span class="check-icon">✓</span>
        <span>Pop-ups & Tracking Scripts</span>
        <span class="feature-tag">DEFUSED</span>
      </div>
    </section>

    <!-- Bottom Actions -->
    <footer class="footer">
      <button id="reloadTabBtn" class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>Reload Page</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
