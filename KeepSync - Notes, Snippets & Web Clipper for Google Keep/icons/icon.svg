<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="26" ry="26" fill="url(#bgGrad)" stroke="#fef3c7" stroke-width="2.5"/>

  <!-- Keep Lightbulb Body -->
  <g filter="url(#shadow)">
    <!-- Main Bulb Sphere -->
    <circle cx="64" cy="54" r="28" fill="#ffffff"/>
    <!-- Waist Transition -->
    <path d="M40 60 L88 60 L78 84 L50 84 Z" fill="#ffffff"/>
    
    <!-- Inner Filament Accent -->
    <path d="M52 50 C52 40, 76 40, 76 50" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Base Threads -->
    <path d="M51 89 L77 89" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M53 96 L75 96" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M57 103 L71 103" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Live Sync Badge -->
  <g transform="translate(76, 76)">
    <!-- Badge Background -->
    <circle cx="22" cy="22" r="22" fill="#202124" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Sync Arrows (Emerald) -->
    <path d="M14 22 A 8 8 0 0 1 27 15" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <polygon points="27,11 31,16 25,18" fill="#34d399"/>
    
    <path d="M30 22 A 8 8 0 0 1 17 29" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <polygon points="17,33 13,28 19,26" fill="#34d399"/>
  </g>
</svg>
